<!doctype html>
<!--
  GANTRY: swing the box, drop it on the plan colour, keep her level — load all 9 ships before
  the hull gives out, and finish with the Typhoon Freighter in a rising storm.
  WIN: load all 9 ships. LOSE: the hull reaches zero (splashes and slides cost 1 each).
  Scope: 5 cargo colours - 3 cargo classes (plain, heavy steel, fragile glass) - 9 ships over
  3 shifts - squall lines, gulls and swell - harbour orders on every ship - 20 rig cards
  drafted between ships - 3 difficulties - endless NIGHT SHIFT - 12 feats - 6 shift trials.
  Tech: fixed 60 Hz seeded sim (plain classic scripts, one GT_* global per file); DOM-free sim
  modules (config..sim) load headless in Node; headless bot tools verify balance and staging.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GANTRY — a container-crane loading game</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="GANTRY: swing containers from a gantry crane onto each ship's cargo plan, match the colours, keep the ship level and load all nine ships"></canvas>
<div id="overlay" role="dialog" aria-live="polite"></div>
<p id="status" role="status" aria-live="polite"></p>
